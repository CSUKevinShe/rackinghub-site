<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RackingHub 报价系统</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>RackingHub 报价系统（内部工具 · 框架版）</h1>
      <div class="sub">选模板 → 填参数 → 自动算成本/报价，模板库持续补充中</div>
    </div>
    <div class="toolbar">
      <button id="btn-export-json">导出 JSON</button>
      <button id="btn-export-csv">导出 CSV</button>
      <button id="btn-print">打印/导出PDF</button>
      <button id="btn-clear" class="danger">清空报价单</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel templates">
      <h2>产品模板</h2>
      <div id="template-list"></div>
    </section>

    <section class="panel entries-panel">
      <h2>当前报价单（<span id="entry-count">0</span> 项）</h2>
      <div id="entries" class="entries">
        <div class="empty-hint">从左侧选一个模板，开始添加产品行</div>
      </div>
    </section>

    <section class="panel summary-panel">
      <h2>订单汇总</h2>
      <div id="order-summary"></div>

      <div class="panel settings-panel" style="margin-top:14px;">
        <h2>参数设置</h2>
        <div id="settings-form" class="settings-block"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    数据仅保存在本机浏览器（localStorage），不会上传。计算公式依据内部 Excel 报价表拆解整理，如有出入以最新业务确认为准。
  </footer>

  <script src="./calc.js"></script>
  <script src="./app.js"></script>
</body>
</html>
